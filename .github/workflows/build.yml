
name: Build MouseCorsul APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MouseCorsul APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project Files
        run: |
          echo "Project structure:"
          ls -la
          echo "Android files:"
          find app -maxdepth 5 -type f -print
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee build-log.txt

      - name: Show Build Error
        if: always()
        run: |
          if [ -f build-log.txt ]; then
            echo "========== BUILD ERROR =========="
            grep -n -i -A 8 -B 8 -E \
              "What went wrong|Caused by:|Execution failed|error:" \
              build-log.txt | tail -100 || true
            echo "========== LAST 100 LINES =========="
            tail -100 build-log.txt
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MouseCorsul-Build-Log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Check Build Result
        if: always() && steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MouseCorsul-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
