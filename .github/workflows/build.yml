        - name: Locate Android Project
          run: |
            echo "Current directory:"
            pwd

            echo "Repository files:"
            ls -la

            echo "Gradle files:"
            find . -maxdepth 6 -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" -o \
              -name "gradlew" \
            \) -print
